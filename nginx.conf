worker_processes auto;

# 300k+ file descriptors – enough for 100k+ connections
worker_rlimit_nofile 300000;

events {
    worker_connections 102400;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # Docker DNS resolver – re‑resolves every 5 seconds
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ================================================================
    # REAL IP EXTRACTION (Uncomment if behind Cloudflare/ALB/Ingress)
    # ================================================================
    # set_real_ip_from  10.0.0.0/8;
    # set_real_ip_from  172.16.0.0/12;
    # set_real_ip_from  192.168.0.0/16;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # ================================================================
    # RATE LIMITING ZONES
    # ================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:30m rate=10000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:30m;

    # ================================================================
    # UPSTREAM CLUSTER – Dynamic DNS with keepalive
    # ================================================================
    upstream gateway_cluster {
        server gateway:4000 max_fails=5 fail_timeout=10s;
        keepalive 8192;   # Reuses idle connections for performance
    }

    server {
        listen 4000 default_server deferred;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # ================================================================
        # REST API PROXY
        # ================================================================
        location / {
            limit_req zone=api_limit burst=20000 nodelay;
            limit_conn conn_limit 500;   # Allows 500 concurrent per IP

            proxy_buffers 32 32k;
            proxy_buffer_size 64k;
            proxy_busy_buffers_size 128k;

            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # Enables keepalive

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;   # Reasonable – not too aggressive
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # ================================================================
        # WEBSOCKET PROXY (CHAT)
        # ================================================================
        location /api/chat {
            limit_conn conn_limit 500;   # Same per‑IP limit for WebSockets
            proxy_buffering off;

            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}