apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 6
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: gcr.io/YOUR_PROJECT_ID/gateway:latest
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: NODE_OPTIONS
          value: "--max-old-space-size=8192"
        - name: UV_THREADPOOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: UV_THREADPOOL_SIZE
        - name: RATE_LIMIT_MAX
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RATE_LIMIT_MAX
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 4000
    targetPort: 4000
  type: LoadBalancer
