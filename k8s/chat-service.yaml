apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 4
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: gcr.io/YOUR_PROJECT_ID/chat-service:latest
        ports:
        - containerPort: 30000
        - containerPort: 30001
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: DB_PASSWORD
        - name: PORT
          value: "30000"
        - name: HTTP_PORT
          value: "30001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  selector:
    app: chat-service
  ports:
  - name: ws
    port: 30000
    targetPort: 30000
  - name: http
    port: 30001
    targetPort: 30001
  type: ClusterIP
