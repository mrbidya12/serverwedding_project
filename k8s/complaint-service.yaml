apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaint-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: complaint-service
  template:
    metadata:
      labels:
        app: complaint-service
    spec:
      containers:
      - name: complaint-service
        image: gcr.io/YOUR_PROJECT_ID/complaint-service:latest
        ports:
        - containerPort: 3004
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: DB_PASSWORD
        - name: PORT
          value: "3004"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: complaint-service
spec:
  selector:
    app: complaint-service
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP
